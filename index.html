<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מאמן">
  <title>מאמן כושר</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><svg class="i logo" aria-hidden="true"><use href="#i-logo"/></svg> המאמן</div>
    <div class="top-r"><span id="sync" data-a="settings"></span><button class="icon-btn" data-a="settings" aria-label="הגדרות"><svg class="i" aria-hidden="true"><use href="#i-gear"/></svg></button></div>
  </header>

  <main id="view"></main>

  <div id="restbar">
    <div class="rest-prog"><i id="rest-prog"></i></div>
    <div class="rest-in">
      <div><div id="rest-label" class="small muted">מנוחה</div><div id="rest-time" class="rest-time">0:00</div></div>
      <button class="sm" data-a="rest-add">+15</button>
      <button class="ghost" data-a="rest-skip">דלג</button>
    </div>
  </div>

  <nav class="tabbar">
    <button data-a="tab" data-t="today"><svg class="i" aria-hidden="true"><use href="#i-dumbbell"/></svg>אימון</button>
    <button data-a="tab" data-t="progress"><svg class="i" aria-hidden="true"><use href="#i-chart"/></svg>התקדמות</button>
    <button data-a="tab" data-t="skills"><svg class="i" aria-hidden="true"><use href="#i-tree"/></svg>סקילס</button>
    <button data-a="tab" data-t="ach"><svg class="i" aria-hidden="true"><use href="#i-trophy"/></svg>הישגים</button>
  </nav>

  <div id="focus"></div>
  <div id="modal"></div>
  <div id="toasts"></div>
  <canvas id="confetti"></canvas>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/app.js"></script>
  <script src="js/focus.js"></script>
</body>
</html>
